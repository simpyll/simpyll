name: Validate Simpyll
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:projects
      - run: npm run test:redirects
      - run: npm run test:notion
      - run: npm run test:images
      - run: npm run test:content
      - run: npm run test:search
      - run: npm run test:smoke
      - run: npm run build
      - run: node --test scripts/discovery.test.mjs
      - run: npm run lint
      - run: node --test scripts/ai-engineering.test.mjs scripts/contributions.test.mjs scripts/case-study.test.mjs scripts/prerender.test.mjs scripts/remark-heading-ids.test.mjs scripts/article-toc.test.mjs scripts/motion.test.mjs scripts/navigation.test.mjs

      - name: Install browsers for accessibility and browser tests
        run: npx playwright install --with-deps chromium firefox webkit

      - run: npm run test:notion:build

      - name: Test rich MDX and Notion rendering
        run: npm run test:mdx

      - name: Enforce accessibility and browser regressions (desktop and mobile)
        run: npm run test:e2e:built

      - name: Upload browser test diagnostics and navigation screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
            artifacts/rich-content/
            artifacts/toc/
            docs/discovery/
          retention-days: 14
          if-no-files-found: ignore
