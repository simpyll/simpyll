name: Validate Simpyll
on:
  workflow_dispatch:
    inputs:
      full_matrix:
        description: Run extended portable journeys across all browser engines
        type: boolean
        default: true
  schedule:
    - cron: '23 7 * * 2'
  pull_request:
    branches: [main]
concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Restore image transformations
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: public/images/optimized
          key: images-${{ runner.os }}-${{ hashFiles('package-lock.json', 'scripts/images/**', 'scripts/publishing-media.mjs', 'src/content/blog/**', 'public/images/**') }}
      - name: Build and validate production output
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Fast deterministic regression suites
        run: npm run test:unit
      - name: Inventory dependency license metadata
        run: npm run audit:licenses
      - name: Verify dependency maintenance and publishing health contracts
        run: |
          npm run test:dependency-maintenance
          node --test scripts/publishing-health.test.mjs
      - name: Verify LipidPath clinical scenarios and source traceability
        run: node --test scripts/lipidpath.test.mjs scripts/lipidpath-ui.test.mjs
      - name: Verify workflow, project and publishing contracts
        run: node --test scripts/ci-workflows.test.mjs scripts/projects.test.mjs scripts/validate-content.test.mjs
      - name: Check high and critical vulnerabilities
        run: npm audit --audit-level=high
      - name: Record artifact revision
        if: github.event_name != 'pull_request'
        run: git rev-parse HEAD > ci-revision.txt
      - name: Share build for scheduled and manual checks
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validated-build
          retention-days: 1
          include-hidden-files: true
          path: |
            ci-revision.txt
            dist/
            dist-server/
            src/generated/
            public/images/optimized/

  # Browser jobs are skipped on PRs; scheduled and manual runs execute full shards.
  # Inactive critical entries do no work; active full shards and fixtures must pass.
  browser:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    strategy:
      fail-fast: false
      matrix:
        include:
          # These critical entries are inactive because PRs skip the browser job.
          - { mode: critical, shard: 1 }
          - { mode: critical, shard: 2 }
          # Exhaustive inventory across the same three balanced shards as before.
          - { mode: full, shard: 1 }
          - { mode: full, shard: 2 }
          - { mode: full, shard: 3 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      # Inactive matrix entries (wrong mode for this event) stop here and succeed
      # with every test step skipped; the aggregate gate still requires the
      # active tiers to pass, so nothing weaker can pass validation.
      - run: npm ci
        if: (matrix.mode == 'critical' && github.event_name == 'pull_request') || (matrix.mode == 'full' && github.event_name != 'pull_request')
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: (matrix.mode == 'critical' && github.event_name == 'pull_request') || (matrix.mode == 'full' && github.event_name != 'pull_request')
        with:
          name: validated-build
      - name: Verify artifact revision
        if: (matrix.mode == 'critical' && github.event_name == 'pull_request') || (matrix.mode == 'full' && github.event_name != 'pull_request')
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(cat ci-revision.txt)" = "$(git rev-parse HEAD)"
      # Pinned official image already contains Chromium, Firefox, WebKit and OS dependencies.
      # Avoid apt-based install-deps hanging across three parallel shards.
      - name: Enforce focused critical browser and accessibility projects
        if: matrix.mode == 'critical' && github.event_name == 'pull_request'
        env:
          HOME: /root
        run: npm run test:e2e:pr -- --shard=${{ matrix.shard }}/2
      - name: Enforce all browser and accessibility projects
        if: matrix.mode == 'full' && github.event_name != 'pull_request'
        env:
          HOME: /root
          PLAYWRIGHT_FULL_MATRIX: ${{ (github.event_name == 'schedule' || inputs.full_matrix) && '1' || '' }}
        run: npm run test:e2e:built -- --shard=${{ matrix.shard }}/3
      - name: Exercise production verification against the candidate release
        if: matrix.shard == 1 && ((matrix.mode == 'critical' && github.event_name == 'pull_request') || (matrix.mode == 'full' && github.event_name != 'pull_request'))
        env:
          HOME: /root
          SMOKE_BASE_URL: http://127.0.0.1:4174
          SMOKE_MANIFEST: dist/deployment.json
        run: |
          export SMOKE_EXPECTED_SHA="$(cat ci-revision.txt)"
          npm run preview -- --host 127.0.0.1 --port 4174 --strictPort > /tmp/production-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          npm run smoke:http
          npm run smoke:browser
      - name: Preserve browser reports and layout evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-results-${{ matrix.mode }}-${{ matrix.shard }}
          retention-days: 14
          if-no-files-found: ignore
          path: |
            playwright-report/
            test-results/
            artifacts/toc/
            docs/discovery/
            docs/pulse/
            artifacts/production/

  fixtures:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: validated-build
      - name: Verify artifact revision
        run: test "$(cat ci-revision.txt)" = "$(git rev-parse HEAD)"
      - uses: ./.github/actions/browsers
        with:
          browsers: chromium
      - run: npm run test:projects
      - run: node --test scripts/preview-notion-build.test.mjs
      - name: Verify recovery from a clean clone
        run: node --test scripts/recovery-build.test.mjs
      - run: npm run test:notion:build
      - run: node --test scripts/notion-growth.test.mjs
      - name: Test rich MDX and Notion rendering
        run: npm run test:mdx
      - name: Preserve fixture diagnostics and syntax screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: publishing-fixture-results
          retention-days: 14
          if-no-files-found: ignore
          path: |
            playwright-report/
            test-results/
            artifacts/rich-content/
            artifacts/toc/
            artifacts/editorial/

  # Variable lab measurements do not join the required validate dependency list.
  # Weekly/manual runs cover all six templates; PRs skip this job.
  performance:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: validated-build
      - name: Verify artifact revision
        run: test "$(cat ci-revision.txt)" = "$(git rev-parse HEAD)"
      - uses: ./.github/actions/browsers
        with:
          browsers: chromium
      - name: Audit mobile and desktop performance
        env:
          PERF_RUNS: ${{ github.event_name == 'pull_request' && '1' || '3' }}
          PERF_ROUTES: ${{ github.event_name == 'pull_request' && '/' || '' }}
        run: npm run perf:lighthouse
      - name: Observe current production separately from candidate build
        env:
          PERF_ORIGIN: https://simpyll.com
          PERF_OUTPUT: artifacts/performance/production
          PERF_RUNS: '1'
          PERF_ROUTES: '/'
        run: npm run perf:lighthouse
      - name: Retain Lighthouse reports even when collection fails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lighthouse-performance
          retention-days: 14
          if-no-files-found: error
          path: artifacts/performance/

  # Preserve the existing branch-protection context. Never let a failed or
  # skipped dependency turn this required check green.
  validate:
    if: always()
    needs: [build, browser, fixtures]
    runs-on: ubuntu-latest
    steps:
      - name: Require every validation tier
        env:
          RESULTS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
        run: |
          node -e 'const jobs = JSON.parse(process.env.RESULTS); for (const [name, job] of Object.entries(jobs)) { if (name !== "build" && job.result === "skipped" && process.env.EVENT === "pull_request") continue; if (job.result !== "success") { console.error(name, job.result); process.exitCode = 1 } }'

