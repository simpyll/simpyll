name: Validate Simpyll
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:notion
      - run: npm run test:content
      - run: npm run test:notion:build
      - run: npm run build
      - run: npm run lint
      - run: node --test scripts/prerender.test.mjs scripts/motion.test.mjs

      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium

      - name: Test production site in desktop and mobile browsers
        run: npm run test:e2e:built

      - name: Upload browser test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
