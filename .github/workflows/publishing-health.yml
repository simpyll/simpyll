name: Weekly Notion publishing audit
on:
  schedule:
    - cron: '37 9 * * 0'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  deployments: read
concurrency:
  group: weekly-publishing-health
  cancel-in-progress: false
jobs:
  audit:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - name: Audit publishing metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/publishing-health.mjs
