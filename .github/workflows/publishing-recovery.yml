name: Monthly publishing recovery drill
on:
  schedule:
    - cron: '17 4 3 * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: monthly-publishing-recovery
  cancel-in-progress: false
jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Test isolated Git recovery and report results
        run: npm run drill:recovery
