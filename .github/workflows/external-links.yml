name: External link health
on:
  schedule:
    - cron: '17 8 * * 2'
  workflow_dispatch:
permissions: {}
concurrency:
  group: external-link-health
  cancel-in-progress: false
jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .external-link-state
          key: external-links-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: external-links-v1-
      - name: Check public links
        run: node scripts/external-links/run.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: external-link-report
          path: artifacts/external-links/
          retention-days: 30
          if-no-files-found: error
  report:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: external-link-report
          path: report
      - name: Maintain one tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs'), cp = require('node:child_process');
          const { actionable, body } = JSON.parse(fs.readFileSync('report/issue.json', 'utf8'));
          const marker = '<!-- simpyll-external-link-monitor-v1 -->';
          const run = (...args) => cp.execFileSync('gh', args, { encoding: 'utf8' });
          const issues = JSON.parse(run('api', '--paginate', '--slurp', `repos/${process.env.GH_REPO}/issues?state=open&per_page=100`)).flat();
          const matches = issues.filter(i => !i.pull_request && i.user?.login === 'github-actions[bot]' && i.body?.includes(marker));
          if (matches.length > 1) throw new Error('Multiple monitoring issues found; resolve duplicates manually');
          const issue = matches[0];
          if (!issue && !actionable) process.exit(0);
          const content = `${marker}\n${body}`;
          if (issue && issue.body === content) process.exit(0);
          fs.writeFileSync('report/payload.json', JSON.stringify(issue ? {body: content} : {title: 'External link health: editorial review', body: content}));
          if (issue) run('api', '--method', 'PATCH', `repos/${process.env.GH_REPO}/issues/${issue.number}`, '--input', 'report/payload.json');
          else run('api', '--method', 'POST', `repos/${process.env.GH_REPO}/issues`, '--input', 'report/payload.json');
          NODE
