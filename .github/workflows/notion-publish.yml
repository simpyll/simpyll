name: Publish Notion blog

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate against Notion without committing or deploying
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: notion-blog-publisher
  cancel-in-progress: false

jobs:
  sync:
    # Never run the publisher against a feature branch or PR.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      revision: ${{ steps.commit.outputs.revision }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:notion
      - run: npm run test:content
      - name: Read Published articles and validate MDX
        env:
          NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
          NOTION_PAGE_ID: ${{ secrets.NOTION_PAGE_ID }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            npm run sync:notion -- --dry-run
          else
            npm run sync:notion
          fi
      - name: Detect content changes
        id: changes
        run: |
          if [ -n "$(git status --porcelain -- src/content/blog public/images/notion .notion)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Validate updated site before committing
        if: steps.changes.outputs.changed == 'true'
        run: |
          npm run build
          npm run lint
          node --test scripts/prerender.test.mjs
      - name: Commit only publisher-owned changes
        id: commit
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/content/blog .notion
          if [ -d public/images/notion ]; then git add -- public/images/notion; fi
          git diff --cached --quiet && exit 0
          git commit -m 'content: synchronize published Notion articles'
          # A concurrent main update rejects this push; never force or rebase unvalidated content.
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  deploy:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ needs.sync.outputs.revision }}
