<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Simpyll publishing architecture</title><desc id="desc">Six stages: write in Notion, synchronize with GitHub Actions, convert to MDX, build and prerender, deploy to GitHub Pages, and read on Simpyll.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101e2b"/><stop offset="1" stop-color="#162c34"/></linearGradient><linearGradient id="panel" x2="0" y2="1"><stop stop-color="#203743"/><stop offset="1" stop-color="#182b35"/></linearGradient></defs><rect width="1200" height="675" rx="28" fill="url(#bg)"/><g font-family="Inter,system-ui,sans-serif"><text x="60" y="83" fill="#ecfff8" font-size="39" font-weight="750">From an idea to a published article</text><text x="60" y="119" fill="#a9c5c4" font-size="19">The Simpyll publishing pipeline · Notion → MDX → React → GitHub Pages</text><path d="M105 310H1090" stroke="#6ce5bc" stroke-width="4" stroke-dasharray="7 13" opacity=".6"/><g><rect x="49" y="207" width="173" height="215" rx="18" fill="url(#panel)" stroke="#42616a"/><circle cx="135" cy="252" r="25" fill="#69e2b7"/><text x="135" y="260" fill="#112c2a" text-anchor="middle" font-size="19" font-weight="750">01</text><text x="135" y="328" fill="#f0fff9" text-anchor="middle" font-size="19" font-weight="700">Notion</text><text x="135" y="359" fill="#bdd5d1" text-anchor="middle" font-size="12.5">Write & organize</text><rect x="240" y="207" width="173" height="215" rx="18" fill="url(#panel)" stroke="#42616a"/><circle cx="326" cy="252" r="25" fill="#69e2b7"/><text x="326" y="260" fill="#112c2a" text-anchor="middle" font-size="19" font-weight="750">02</text><text x="326" y="328" fill="#f0fff9" text-anchor="middle" font-size="16" font-weight="700">GitHub Actions</text><text x="326" y="359" fill="#bdd5d1" text-anchor="middle" font-size="12.5">Sync published posts</text><rect x="431" y="207" width="173" height="215" rx="18" fill="url(#panel)" stroke="#42616a"/><circle cx="517" cy="252" r="25" fill="#69e2b7"/><text x="517" y="260" fill="#112c2a" text-anchor="middle" font-size="19" font-weight="750">03</text><text x="517" y="328" fill="#f0fff9" text-anchor="middle" font-size="19" font-weight="700">MDX</text><text x="517" y="359" fill="#bdd5d1" text-anchor="middle" font-size="12.5">Rich technical content</text><rect x="622" y="207" width="173" height="215" rx="18" fill="url(#panel)" stroke="#42616a"/><circle cx="708" cy="252" r="25" fill="#69e2b7"/><text x="708" y="260" fill="#112c2a" text-anchor="middle" font-size="19" font-weight="750">04</text><text x="708" y="328" fill="#f0fff9" text-anchor="middle" font-size="19" font-weight="700">Vite + React</text><text x="708" y="359" fill="#bdd5d1" text-anchor="middle" font-size="12.5">Build & prerender</text><rect x="813" y="207" width="173" height="215" rx="18" fill="url(#panel)" stroke="#42616a"/><circle cx="899" cy="252" r="25" fill="#69e2b7"/><text x="899" y="260" fill="#112c2a" text-anchor="middle" font-size="19" font-weight="750">05</text><text x="899" y="328" fill="#f0fff9" text-anchor="middle" font-size="19" font-weight="700">GitHub Pages</text><text x="899" y="359" fill="#bdd5d1" text-anchor="middle" font-size="12.5">Deploy static HTML</text><rect x="1004" y="207" width="173" height="215" rx="18" fill="url(#panel)" stroke="#42616a"/><circle cx="1090" cy="252" r="25" fill="#69e2b7"/><text x="1090" y="260" fill="#112c2a" text-anchor="middle" font-size="19" font-weight="750">06</text><text x="1090" y="328" fill="#f0fff9" text-anchor="middle" font-size="19" font-weight="700">Simpyll</text><text x="1090" y="359" fill="#bdd5d1" text-anchor="middle" font-size="12.5">Read & explore</text></g><rect x="50" y="477" width="1100" height="119" rx="18" fill="#1b353e" stroke="#385b62"/><text x="79" y="516" fill="#d8fff0" font-size="18" font-weight="700">Designed for a better reading experience</text><text x="79" y="555" fill="#9de7ce" font-size="16">Fast static pages    •    Accessible content    •    Responsive tables    •    Code highlighting    •    Safe embeds</text><text x="60" y="643" fill="#7ca29f" font-size="14">SIMPYLL  /  BUILD IN PUBLIC</text></g></svg>